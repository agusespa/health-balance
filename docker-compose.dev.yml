services:
  app:
    build: .
    container_name: health-balance-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/health.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INGEST_TOKEN=${INGEST_TOKEN}
      - PORT=8080
    volumes:
      - ./data:/app/data
