services:
  app:
    build: .
    container_name: health-balance-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/health.db
      - CLAUDE_RUN_URL=${CLAUDE_RUN_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=8080
    volumes:
      - ./data:/app/data
